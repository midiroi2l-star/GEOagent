<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<title>전도서 31일 묵상</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#23302b;--sub:#6b766f;--line:#e4dfd3;--main:#2f5d50;--main2:#dcebe4;--gold:#c08a2e;--done:#2f5d50;--today:#c08a2e}
@media(prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1e2723;--ink:#e8efe9;--sub:#95a39b;--line:#2d3832;--main:#6fb59e;--main2:#23362f;--gold:#e0b15a;--done:#6fb59e;--today:#e0b15a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{padding:18px 16px 6px;max-width:640px;margin:0 auto}
header h1{margin:0;font-size:20px}
header p{margin:2px 0 0;color:var(--sub);font-size:13px}
main{max-width:640px;margin:0 auto;padding:8px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card h2{margin:0 0 6px;font-size:13px;color:var(--main);letter-spacing:.02em}
.card p{margin:0}
.ref{font-size:13px;color:var(--gold);font-weight:700}
.title{font-size:20px;font-weight:700;margin:2px 0 8px;line-height:1.4}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:0;background:none;padding:12px 0;font:inherit;font-size:13px;color:var(--sub);cursor:pointer}
nav.tabs button.on{color:var(--main);font-weight:700}
.btn{display:inline-block;border:1px solid var(--main);color:var(--main);background:none;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
.btn.fill{background:var(--main);color:#fff}
@media(prefers-color-scheme:dark){.btn.fill{color:#10201a}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.media{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.media:first-of-type{border-top:0}
.media b{display:block}
.media small{color:var(--sub)}
.media .btn{margin-left:auto;white-space:nowrap}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.daynav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}
.daynav span{font-weight:700}
.bar{height:10px;background:var(--main2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--main);border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0}
.cell small{font-size:9px;color:var(--sub)}
.cell.done{background:var(--done);color:#fff;border-color:var(--done)}
.cell.done small{color:#ffffffcc}
@media(prefers-color-scheme:dark){.cell.done{color:#10201a}.cell.done small{color:#10201acc}}
.cell.today{outline:2px solid var(--today);outline-offset:1px}
.cell.future{opacity:.55}
.cell.empty{visibility:hidden}
.week{display:flex;flex-direction:column;gap:8px}
.wk{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.wk .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-weight:700;flex:none}
.wk.done .n{background:var(--done);border-color:var(--done);color:#fff}
.wk.today{border-color:var(--today)}
.wk small{color:var(--sub);display:block}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:12px;color:var(--sub);margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--main)}
.stats small{color:var(--sub)}
.ch{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.ch span:first-child{width:34px;color:var(--sub)}
.ch .bar{flex:1}
.ch span:last-child{width:38px;text-align:right;color:var(--sub);font-size:12px}
label.set{display:block;font-size:13px;color:var(--sub)}
input[type=date]{font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.done-btn{width:100%;padding:14px;border-radius:14px;border:0;background:var(--main);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:4px}
@media(prefers-color-scheme:dark){.done-btn{color:#10201a}}
.done-btn.on{background:var(--main2);color:var(--main)}
.note{font-size:12px;color:var(--sub);margin:10px 2px}
.prayer{font-style:italic}
.v{margin:0 0 8px!important}.v sup{color:var(--gold);font-weight:700;margin-right:5px;font-size:11px}.summary{color:var(--sub)}
</style>
</head>
<body>
<header><h1>📖 전도서 31일 묵상</h1><p id="sub"></p></header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<script>
// 전도서 31일 묵상 데이터
// 본문은 verses.js(개역한글, 공개 도메인)에 있습니다.
window.DAYS = [
{ref:"1:1-11", ch:[1], title:"해 아래의 모든 것이 헛되다",
 summary:"전도자가 자신을 소개하고, 세대가 오고 가도 해와 바람과 강물은 같은 자리를 맴돌 뿐이라고 말합니다. 해 아래 새것이 없다는 고백입니다.",
 interp:"'헛되다'(히브리어 헤벨)는 '입김, 안개'라는 뜻입니다. 인생이 무가치하다는 선언이 아니라, 붙잡으려 해도 손에 남지 않는 덧없음을 말합니다. 전도서는 '해 아래'의 시선으로 인생을 정직하게 바라보게 합니다.",
 apply:"오늘 내가 붙잡으려 애쓰는 것 한 가지를 적어 보세요. 그것이 1년 뒤에도 중요할지 물어봅니다.",
 prayer:"하나님, 붙잡아도 사라지는 것들에 제 마음을 다 쏟지 않게 하소서. 이 31일 동안 말씀 앞에서 정직하게 제 삶을 돌아보게 하소서. 아멘.",
 hymn:{t:"나의 갈 길 다 가도록"}, ccm:{t:"오직 예수뿐이네"}},
{ref:"1:12-18", ch:[1], title:"지혜를 구했으나 또한 헛되다",
 summary:"전도자는 왕으로서 지혜를 다해 세상 모든 일을 살폈지만, 그것은 바람을 잡는 것 같았다고 말합니다. 지혜가 많을수록 근심도 는다고 고백합니다.",
 interp:"지식 자체가 나쁜 것이 아니라, 지식만으로 삶의 궁극적인 답을 얻으려는 시도가 한계에 부딪힙니다. 세상을 이해하는 능력과 세상을 구원하는 능력은 다릅니다.",
 apply:"오늘 '더 알면 안심될 것 같은' 걱정이 있다면, 아는 것 대신 맡기는 것을 선택해 보세요.",
 prayer:"주님, 아는 것이 많아질수록 더 교만하거나 불안해지지 않게 하소서. 주를 경외함이 지혜의 시작임을 기억하게 하소서. 아멘.",
 hymn:{t:"나의 사랑하는 책"}, ccm:{t:"주의 말씀은 내 발의 등"}},
{ref:"2:1-11", ch:[2], title:"쾌락과 업적도 만족을 주지 못한다",
 summary:"전도자는 웃음과 술, 큰 공사와 정원, 재물과 음악을 마음껏 누렸습니다. 그러나 돌아보니 모두 바람을 잡는 것이었습니다.",
 interp:"가장 많이 누려 본 사람의 고백이라서 무게가 있습니다. 즐거움과 성취는 선물이지만, 그것이 '나를 채워 주는 신'이 될 때 공허가 찾아옵니다.",
 apply:"즐거움을 누릴 때 '이 선물을 주신 분'께 잠깐 감사를 드려 보세요. 선물을 넘어 주인을 바라보는 연습입니다.",
 prayer:"주님, 제가 누리는 기쁨과 성취가 주께서 주신 선물임을 알게 하소서. 그것으로 영혼을 채우려 하지 않게 하소서. 아멘.",
 hymn:{t:"내 영혼에 햇빛 비치니"}, ccm:{t:"주님 한 분만으로"}},
{ref:"2:12-17", ch:[2], title:"지혜자도 어리석은 자도 같은 끝을 맞는다",
 summary:"지혜가 어리석음보다 낫다는 것은 빛이 어둠보다 나은 것과 같지만, 결국 둘 다 죽음을 맞는다는 사실에 전도자는 괴로워합니다.",
 interp:"죽음 앞에서는 어떤 지혜도 출구가 되지 못합니다. 이 불편한 진실은 '해 아래' 세상의 답이 아니라, 하늘의 소망이 필요함을 가리킵니다.",
 apply:"오늘 잠시 '내 삶이 끝날 때 남기고 싶은 것'을 한 문장으로 적어 보세요.",
 prayer:"하나님, 죽음이 모든 것의 끝이라는 두려움에 매이지 않게 하소서. 영원한 소망이신 주님을 바라보게 하소서. 아멘.",
 hymn:{t:"이 몸의 소망 무언가"}, ccm:{t:"나의 소망 되신 주"}},
{ref:"2:18-26", ch:[2], title:"수고의 열매, 그리고 하나님의 손",
 summary:"애써 모은 것을 누가 물려받을지 모른다는 허탈함을 말하던 전도자는, 먹고 마시고 수고 중에 낙을 누리는 것이 하나님의 손에서 나온다고 고백합니다.",
 interp:"전도서 전체에서 처음으로 분명히 나오는 전환점입니다. 일과 식탁의 작은 기쁨은 내가 쟁취한 전리품이 아니라 하나님이 주시는 선물입니다.",
 apply:"오늘 식사 한 끼를 '선물'로 받는 마음으로 천천히 먹고, 마치기 전에 감사 기도를 드려 보세요.",
 prayer:"주님, 제 수고의 열매를 움켜쥐지 않고 주께 맡기게 하소서. 오늘 먹고 마시는 작은 기쁨을 주의 선물로 받게 하소서. 아멘.",
 hymn:{t:"내 영혼아 찬양하라"}, ccm:{t:"감사함으로 그 문에 들어가"}},
{ref:"3:1-8", ch:[3], title:"모든 일에는 때가 있다",
 summary:"태어날 때와 죽을 때, 심을 때와 뽑을 때, 울 때와 웃을 때 등 삶의 열네 쌍의 때가 나옵니다. 하나님이 정하신 때가 있습니다.",
 interp:"삶이 무작위로 흘러가는 것이 아니라, 하나님이 정하신 계절 속에 있다는 위로입니다. 지금의 눈물도, 지금의 기쁨도 영원하지 않으며 '때'에 속해 있습니다.",
 apply:"지금 내가 지나는 계절이 무엇인지(심는 때? 기다리는 때? 우는 때?) 이름을 붙여 보세요.",
 prayer:"하나님, 제가 서 있는 이 계절이 주의 손 안에 있음을 믿습니다. 때를 앞당기려 하지 않고 주의 시간을 기다리게 하소서. 아멘.",
 hymn:{t:"내 주는 살아 계시고"}, ccm:{t:"주의 때에"}},
{ref:"3:9-15", ch:[3], title:"하나님은 모든 것을 때에 맞게 아름답게 하셨다",
 summary:"하나님은 모든 것을 제때에 아름답게 만드시고 사람 마음에 영원을 두셨지만, 사람은 그분의 일을 다 알 수 없습니다. 그래서 기쁘게 선을 행하는 것이 좋다고 합니다.",
 interp:"'영원을 사모하는 마음'은 세상이 채울 수 없는 갈증이 하나님이 주신 것임을 말합니다. 전부 이해하지 못해도 하나님을 경외하는 것이 길입니다.",
 apply:"이해되지 않는 일 하나를 '하나님만 아시는 일'로 내려놓고, 대신 오늘 할 수 있는 선한 일 하나를 하세요.",
 prayer:"주님, 제 마음에 영원을 향한 갈망을 두신 것을 감사합니다. 다 이해하지 못해도 주를 경외하며 걷게 하소서. 아멘.",
 hymn:{t:"오 신실하신 주"}, ccm:{t:"아름다우신 주"}},
{ref:"3:16-22", ch:[3], title:"불의한 세상과 사람의 한계",
 summary:"재판하는 자리에도 악이 있음을 본 전도자는, 하나님이 의인과 악인을 심판하실 때가 있다고 말합니다. 또한 사람도 짐승처럼 흙으로 돌아가는 존재임을 지적합니다.",
 interp:"불의 앞에서 분노와 냉소 사이에서 흔들릴 수 있지만, 전도자는 '하나님이 심판하신다'는 자리에 닻을 내립니다. 사람의 유한함은 겸손을 가르칩니다.",
 apply:"억울하거나 불공평하다고 느끼는 일을 하나님께 '판결을 맡기는' 기도로 올려 보세요.",
 prayer:"공의로운 하나님, 불의를 보고 낙심하지 않게 하소서. 심판을 주께 맡기고, 제가 있는 자리에서 정직하게 살게 하소서. 아멘.",
 hymn:{t:"내 영혼의 그윽히 깊은 데서"}, ccm:{t:"정의를 물같이"}},
{ref:"4:1-8", ch:[4], title:"억눌린 자의 눈물과 외로운 수고",
 summary:"압제당하는 이들의 눈물을 위로해 주는 자가 없음을 보고, 경쟁심에서 나온 수고와 가족도 없이 끝없이 일만 하는 외로운 사람을 돌아봅니다.",
 interp:"전도자는 고통받는 이들을 외면하지 않고 '보는' 사람입니다. 또 이웃을 이기려는 시기에서 비롯된 일과 관계 없는 성공은 허무하다고 말합니다.",
 apply:"오늘 주변에서 위로가 필요한 사람 한 명에게 안부 메시지를 보내 보세요.",
 prayer:"위로의 하나님, 눈물 흘리는 이웃을 보고 지나치지 않게 하소서. 경쟁이 아닌 사랑으로 일하게 하소서. 아멘.",
 hymn:{t:"예수 나를 위하여"}, ccm:{t:"나를 위로하시는 주"}},
{ref:"4:9-16", ch:[4], title:"혼자보다 둘이 낫다",
 summary:"둘이 함께하면 넘어질 때 일으켜 주고, 추울 때 따뜻하게 해 주며, 세 겹줄은 쉽게 끊어지지 않습니다. 또한 인기와 권력의 덧없음도 말합니다.",
 interp:"공동체의 가치를 말하는 유명한 구절입니다. 성공과 인기는 세대가 바뀌면 잊히지만, 함께 서는 사람들과의 관계는 삶을 지탱합니다.",
 apply:"오늘 넘어진 친구나 가족 한 명을 떠올리고, 일으켜 주는 작은 행동(전화, 식사, 기도)을 해 보세요.",
 prayer:"주님, 홀로 버티려 하지 않게 하시고 함께 걸을 사람들을 주셔서 감사합니다. 저도 누군가의 세 겹줄 한 가닥이 되게 하소서. 아멘.",
 hymn:{t:"교회의 기초는 오직 예수"}, ccm:{t:"주 안에 우린 하나"}},
{ref:"5:1-7", ch:[5], title:"하나님 앞에서는 말을 줄이라",
 summary:"하나님의 집에 갈 때는 가까이 가서 듣는 것이 어리석은 자의 제사보다 낫고, 서원은 지체 말고 갚아야 합니다. 말이 많으면 헛된 것이 많아지니 하나님을 경외하라고 합니다.",
 interp:"예배는 내 말을 쏟아내는 시간이기 이전에 '듣는' 시간입니다. 약속과 말의 가벼움을 경계하고, 하나님 앞에서 겸손해지라는 권면입니다.",
 apply:"오늘 기도 시간의 절반은 말하지 않고 조용히 듣는 시간으로 보내 보세요.",
 prayer:"하나님, 제 입이 앞서지 않고 귀가 먼저 열리게 하소서. 주께 한 약속을 가볍게 여기지 않게 하소서. 아멘.",
 hymn:{t:"거룩 거룩 거룩"}, ccm:{t:"내 영혼이 잠잠히"}},
{ref:"5:8-19", ch:[5], title:"돈을 사랑하면 만족이 없다",
 summary:"은을 사랑하는 자는 은으로 만족하지 못하고, 재산이 많으면 먹는 자도 많고 걱정에 잠도 못 잡니다. 빈손으로 와서 빈손으로 간다는 사실을 일깨우고, 하나님이 주신 몫을 누리는 것이 복이라고 말합니다.",
 interp:"재물 자체가 문제가 아니라 재물을 사랑하는 마음이 문제입니다. 수고의 열매를 기쁘게 누릴 수 있는 것 자체가 하나님이 주시는 선물입니다.",
 apply:"내가 가진 것 중 오늘 새삼스럽게 감사할 수 있는 것 세 가지를 적어 보세요.",
 prayer:"주님, 더 가지려는 마음보다 주신 것을 누리는 기쁨을 주소서. 저의 소유가 주의 것임을 알고 나누며 살게 하소서. 아멘.",
 hymn:{t:"나의 생명 드리니"}, ccm:{t:"내게 있는 향유 옥합"}},
{ref:"6:1-12", ch:[6], title:"가지고도 누리지 못하는 불행",
 summary:"재물과 영광을 받았지만 누리지 못하게 하시는 경우를 안타까워하며, 욕심은 끝이 없고 사람의 입은 채워져도 만족하지 못한다고 말합니다.",
 interp:"'눈으로 보는 것이 마음의 방황보다 낫다'는 말처럼, 지금 눈앞에 있는 것에 감사하지 못하고 늘 '다음'을 향해 헤매는 마음을 경고합니다.",
 apply:"오늘 '더 갖고 싶은 것' 대신 '이미 가진 것'에 집중해 10분을 보내 보세요.",
 prayer:"하나님, 손에 쥔 것을 누리지 못하고 늘 다음을 갈망하는 마음을 고쳐 주소서. 지금 이 자리에서 만족하게 하소서. 아멘.",
 hymn:{t:"내 영혼이 은총 입어"}, ccm:{t:"나의 만족"}},
{ref:"7:1-6", ch:[7], title:"초상집이 잔칫집보다 낫다",
 summary:"좋은 이름이 좋은 향유보다 낫고, 죽음을 생각하는 자리가 잔칫집보다 마음에 유익하며, 지혜자의 책망이 어리석은 자의 노래보다 낫다고 말합니다.",
 interp:"죽음과 슬픔을 마주할 때 삶의 우선순위가 분명해집니다. 즐거움만 좇는 웃음은 가시나무 타는 소리처럼 요란하지만 금방 사라집니다.",
 apply:"오늘 듣기 불편하지만 나를 자라게 할 충고가 있다면 받아들일 마음을 가져 보세요.",
 prayer:"주님, 슬픔의 자리에서도 배우게 하소서. 달콤한 말보다 진실한 책망을 귀하게 여기게 하소서. 아멘.",
 hymn:{t:"내 주를 가까이 하게 함은"}, ccm:{t:"예수 나의 첫사랑"}},
{ref:"7:7-14", ch:[7], title:"끝이 시작보다 낫고, 형통과 곤고를 함께 주신다",
 summary:"일의 끝이 시작보다 낫고 참는 마음이 교만한 마음보다 낫습니다. 지혜는 유산처럼 좋고, 하나님이 굽게 하신 것을 누가 곧게 하겠느냐며, 형통한 날엔 기뻐하고 곤고한 날엔 생각하라고 합니다.",
 interp:"형통과 곤고 둘 다 하나님이 '나란히' 두셨다고 말합니다. 그래서 사람은 앞날을 완전히 알 수 없고, 더 겸손히 하나님께 기대게 됩니다.",
 apply:"급하게 결론을 내고 싶은 일이 있다면 오늘은 '끝을 기다리는' 마음으로 하루를 더 참아 보세요.",
 prayer:"주님, 형통할 때 교만하지 않고 어려울 때 낙심하지 않게 하소서. 모든 날이 주의 손 안에 있음을 믿습니다. 아멘.",
 hymn:{t:"저 높은 곳을 향하여"}, ccm:{t:"주는 나의 힘이요"}},
{ref:"7:15-22", ch:[7], title:"지나치게 의롭지도, 악하지도 말라",
 summary:"의인이 망하고 악인이 장수하는 모순을 본 전도자는, 스스로 지나치게 의롭거나 지혜롭게 굴지 말고 악에도 빠지지 말라고 합니다. 또 선만 행하고 죄 짓지 않는 사람은 없다고 말합니다.",
 interp:"'지나친 의로움'은 자기 의에 갇히는 위험을 말합니다. 하나님을 경외하는 사람은 이 모든 균형을 벗어나지 않고, 자신의 연약함도 인정합니다.",
 apply:"오늘 누군가를 비판하고 싶을 때, 나도 같은 실수를 한 적이 있음을 떠올려 보세요.",
 prayer:"하나님, 제 의를 자랑하지 않게 하시고 제 연약함을 인정하며 주의 은혜를 붙들게 하소서. 아멘.",
 hymn:{t:"나 같은 죄인 살리신"}, ccm:{t:"은혜"}},
{ref:"7:23-29", ch:[7], title:"지혜를 찾았으나 닿지 않는 깊이",
 summary:"전도자는 지혜를 끝까지 알려고 했지만 멀고 깊어 미치지 못했습니다. 그는 하나님이 사람을 정직하게 지으셨으나 사람이 많은 꾀를 낸다는 결론에 이릅니다.",
 interp:"삶의 모든 이치를 알아내려는 시도는 한계가 있습니다. 그러나 문제의 뿌리는 창조의 결함이 아니라 사람 스스로 만든 꾀와 죄에 있음을 밝힙니다.",
 apply:"오늘 '왜?'라는 질문에 답이 없더라도, 그 질문을 계속 안고 하나님께 나아가 보세요.",
 prayer:"주님, 저를 정직하게 지으신 뜻을 잊지 않게 하소서. 꾀와 변명 대신 솔직한 마음으로 주께 나아가게 하소서. 아멘.",
 hymn:{t:"나의 죄를 씻기는"}, ccm:{t:"마음을 다해"}},
{ref:"8:1-9", ch:[8], title:"권위에 대한 지혜와 때를 아는 마음",
 summary:"지혜는 사람의 얼굴을 빛나게 합니다. 왕의 명령을 지키고 때와 판단을 아는 것이 지혜이며, 사람은 바람을 주관하거나 죽음의 날을 막을 수 없다고 말합니다.",
 interp:"권위에 대한 존중과 분별은 지혜의 일부입니다. 그러나 권력이 사람을 해치는 경우도 있으니, 모든 것을 통제할 수 없다는 사실을 받아들이는 것도 지혜입니다.",
 apply:"내가 통제하려는 일 중 '내 몫이 아닌 것'을 하나 골라 오늘 내려놓아 보세요.",
 prayer:"주님, 제가 조절할 수 없는 일 앞에서 조급해하지 않게 하소서. 때와 방법을 아시는 주님을 신뢰합니다. 아멘.",
 hymn:{t:"주 하나님 지으신 모든 세계"}, ccm:{t:"온 땅을 다스리시는 주"}},
{ref:"8:10-17", ch:[8], title:"악인이 형통해 보여도 하나님을 경외하는 자가 복되다",
 summary:"악인이 잘 지내는 것 같아 보이는 현실과, 악한 일에 벌이 바로 내려지지 않아 사람들의 마음이 악을 행하기로 굳어지는 것을 지적합니다. 그래도 하나님을 경외하는 자에게 복이 있다고 고백합니다.",
 interp:"즉각적인 보응이 보이지 않을 때 신앙은 시험을 받습니다. 전도자는 모든 것을 설명하지 못하지만, 하나님을 경외하는 쪽에 끝까지 서겠다고 결단합니다.",
 apply:"답답한 현실 앞에서 설명을 요구하기보다, 오늘 '주를 경외하는 작은 순종' 하나를 선택해 보세요.",
 prayer:"하나님, 악이 형통해 보일 때도 주의 공의를 믿게 하소서. 이해되지 않는 중에도 주를 경외하는 길에 서게 하소서. 아멘.",
 hymn:{t:"내 주여 뜻대로"}, ccm:{t:"주를 경외하리"}},
{ref:"9:1-6", ch:[9], title:"모두에게 같은 죽음이 있으나, 산 자에게는 소망이 있다",
 summary:"의인과 악인, 선한 자와 악한 자 모두 같은 운명을 맞이하지만, 살아 있는 자에게는 소망이 있다고 합니다. 산 개가 죽은 사자보다 낫다는 표현이 나옵니다.",
 interp:"죽음은 모두에게 평등하지만, '살아 있음'은 회개하고 사랑하고 바꿀 수 있는 기회입니다. 오늘이라는 시간이 선물임을 강조합니다.",
 apply:"미뤄 왔던 화해나 감사 표현을 오늘 안에 실천해 보세요.",
 prayer:"주님, 오늘 주신 생명을 헛되이 쓰지 않게 하소서. 살아 있는 동안 사랑하고 용서하며 소망을 붙들게 하소서. 아멘.",
 hymn:{t:"주 예수보다 더 귀한 것은 없네"}, ccm:{t:"살아 계신 주"}},
{ref:"9:7-12", ch:[9], title:"기쁘게 먹고, 사랑하는 이와 살고, 힘을 다해 일하라",
 summary:"가서 기쁨으로 음식을 먹고 즐거운 마음으로 포도주를 마시라고 권합니다. 사랑하는 아내와 함께 즐겁게 살고, 손이 일을 찾으면 힘을 다해 하라고 합니다. 그러나 때와 기회는 누구에게나 닥친다고 덧붙입니다.",
 interp:"쾌락주의가 아니라 '하나님이 이미 기뻐하신 일상'을 감사함으로 누리라는 권면입니다. 동시에 재능이나 노력만으로 결과가 보장되지 않음을 겸손히 인정합니다.",
 apply:"오늘 가까운 사람과 시간을 내어 함께 식사하거나 대화해 보세요. 할 일은 미루지 말고 지금 시작해 보세요.",
 prayer:"하나님, 일상의 기쁨을 주신 선물로 받고, 맡기신 일을 힘을 다해 감당하게 하소서. 결과는 주께 맡깁니다. 아멘.",
 hymn:{t:"예수 사랑하심은"}, ccm:{t:"오늘 하루도 주님과 함께"}},
{ref:"9:13-18", ch:[9], title:"가난한 지혜자가 성읍을 구했으나 잊혔다",
 summary:"작은 성읍을 가난한 지혜자가 지혜로 구했지만 아무도 그를 기억하지 않았다는 이야기입니다. 지혜가 무기보다 낫지만, 죄인 하나가 많은 선을 무너뜨릴 수 있다고 말합니다.",
 interp:"세상의 평가와 기억은 불공평할 수 있습니다. 그러나 조용한 지혜의 가치는 사라지지 않으며, 한 사람의 잘못이 공동체에 미치는 영향도 가볍지 않음을 경고합니다.",
 apply:"오늘 인정받지 못해도 해야 할 일을 묵묵히 하나 해 보세요. 그리고 누군가의 숨은 수고에 감사를 표현하세요.",
 prayer:"주님, 사람들의 박수와 상관없이 주 앞에서 성실하게 살게 하소서. 저의 작은 선택이 공동체에 미칠 영향을 조심하게 하소서. 아멘.",
 hymn:{t:"빈 들에 마른 풀같이"}, ccm:{t:"보이지 않는 곳에서"}},
{ref:"10:1-7", ch:[10], title:"작은 어리석음이 큰 향기를 망친다",
 summary:"죽은 파리가 향유를 악취 나게 하듯 작은 어리석음이 지혜와 존귀를 망칠 수 있습니다. 지혜로운 마음은 오른쪽에, 어리석은 마음은 왼쪽에 있으며, 세상은 종이 말을 타고 귀인이 걷는 역전을 보인다고 합니다.",
 interp:"작은 부주의와 교만이 오랜 신뢰를 무너뜨릴 수 있습니다. 지도자의 분노 앞에서도 침착함을 잃지 않는 것이 지혜입니다.",
 apply:"오늘 '별것 아니겠지' 하고 넘기던 작은 습관이나 말 한 가지를 고쳐 보세요.",
 prayer:"하나님, 작은 일에서도 신실하게 하소서. 순간의 분노나 어리석음이 제 삶과 관계를 해치지 않게 지켜 주소서. 아멘.",
 hymn:{t:"주 안에 있는 나에게"}, ccm:{t:"작은 일에도 신실하게"}},
{ref:"10:8-15", ch:[10], title:"행동 전에 지혜와 준비가 필요하다",
 summary:"구덩이를 파는 자가 빠지고 담을 허무는 자는 뱀에 물리며, 도끼가 무디면 힘이 더 든다는 비유가 나옵니다. 지혜자의 말은 은혜롭지만 어리석은 자의 말은 자신을 삼키고 끝없이 계속됩니다.",
 interp:"지혜는 일의 기술이자 말의 절제입니다. 준비 없이 힘으로만 밀어붙이면 손해를 보고, 끝없이 말만 늘어놓는 어리석음은 스스로를 지치게 합니다.",
 apply:"오늘 중요한 일을 시작하기 전 5분 '날을 갈기'(계획, 기도)를 해 보세요.",
 prayer:"주님, 성급함이 아닌 지혜로 일하게 하시고, 제 말이 은혜롭게 하소서. 입술을 지켜 주소서. 아멘.",
 hymn:{t:"나의 기도하는 그 시간"}, ccm:{t:"솔로몬의 지혜를 주소서"}},
{ref:"10:16-20", ch:[10], title:"나라와 지도자, 그리고 말조심",
 summary:"어린아이 같은 왕과 아침부터 잔치하는 관리들의 나라는 화가 있고, 때에 맞게 절제하며 먹는 나라는 복이 있다고 합니다. 게으름은 집을 무너뜨리며, 왕이나 부자를 마음속으로도 저주하지 말라고 권합니다.",
 interp:"지도자의 책임감과 절제, 그리고 구성원의 성실이 공동체를 세웁니다. 은밀한 곳의 말도 새어 나갈 수 있으니 말조심을 하라는 경고입니다.",
 apply:"오늘 나라와 지도자, 직장의 리더를 위해 비난 대신 중보기도를 해 보세요.",
 prayer:"주님, 이 나라와 공동체를 이끄는 이들에게 절제와 지혜를 주소서. 저 또한 말과 행동에서 성실하게 하소서. 아멘.",
 hymn:{t:"나라와 민족을 위하여"}, ccm:{t:"이 땅을 고쳐 주소서"}},
{ref:"11:1-6", ch:[11], title:"불확실해도 씨를 뿌리고 손을 놓지 말라",
 summary:"네 떡을 물 위에 던지라, 그러면 여러 날 후에 다시 얻으리라고 합니다. 바람과 구름만 살피면 씨를 뿌리지 못하니, 아침에도 저녁에도 손을 쉬지 말고 일하라고 권합니다.",
 interp:"모든 것을 다 알 수 있을 때까지 기다리면 아무 일도 할 수 없습니다. 하나님이 하시는 일은 알 수 없으니, 나눔과 수고를 믿음으로 계속하라는 격려입니다.",
 apply:"오늘 결과가 보장되지 않아도 마음에 품은 나눔이나 도전을 '한 걸음' 실행해 보세요.",
 prayer:"하나님, 결과를 다 알 수 없어도 순종하며 씨를 뿌리게 하소서. 열매는 주께서 때에 맞게 거두게 하심을 믿습니다. 아멘.",
 hymn:{t:"일하러 가세"}, ccm:{t:"눈물로 씨를 뿌리는 자"}},
{ref:"11:7-10", ch:[11], title:"젊은 날을 기뻐하되 심판을 기억하라",
 summary:"빛은 사랑스럽고 해를 보는 것은 즐거운 일입니다. 젊은이는 젊은 때를 즐기되 마음의 길을 따르되 하나님이 이 모든 일로 심판하실 줄 알라고 하며, 근심과 악을 몸에서 떠나보내라고 합니다.",
 interp:"삶의 기쁨을 긍정하되 책임 있는 즐거움을 권합니다. 젊음과 새벽은 곧 지나가니, 하나님 앞에서 사는 삶이 즐거움을 더 깊게 합니다.",
 apply:"오늘 가진 젊음과 건강, 시간을 '하나님께 드릴 것'으로 다시 바라보고 한 가지 감사를 적어 보세요.",
 prayer:"주님, 주신 오늘을 기쁘게 누리되 주 앞에서 책임 있게 살게 하소서. 마음의 근심과 악한 것은 주께 맡깁니다. 아멘.",
 hymn:{t:"예수 따라가며"}, ccm:{t:"주님 나의 젊은 날 드립니다"}},
{ref:"12:1-5", ch:[12], title:"너의 창조주를 기억하라 (늙기 전에)",
 summary:"곤고한 날이 이르기 전에, 해와 빛이 어두워지기 전에 창조주를 기억하라고 합니다. 늙어 가는 몸을 집, 맷돌, 창문, 문 등에 비유하여 생생하게 묘사합니다.",
 interp:"노화에 대한 시적인 묘사는 삶의 유한함을 보여 줍니다. 그래서 '기억하라'는 말은 단지 생각하라가 아니라, 창조주께 마음을 드리며 사는 것을 뜻합니다.",
 apply:"나이와 상관없이 오늘, 나를 지으신 분을 기억하는 '한 가지 습관'(기도, 감사 일기)을 시작해 보세요.",
 prayer:"창조주 하나님, 힘이 있을 때 주를 기억하게 하소서. 약해질 때에도 주께서 저를 붙드실 것을 믿습니다. 아멘.",
 hymn:{t:"참 아름다워라"}, ccm:{t:"창조의 아버지"}},
{ref:"12:6-8", ch:[12], title:"은줄이 풀리고 금그릇이 깨지기 전에",
 summary:"은줄, 금그릇, 물동이, 바퀴 같은 그림으로 생명이 끝나는 순간을 묘사하며, 티끌은 흙으로 돌아가고 영은 그것을 주신 하나님께로 돌아간다고 말합니다. 그리고 다시 '헛되고 헛되도다'로 마무리합니다.",
 interp:"죽음은 끝이 아니라 영이 하나님께 돌아가는 여정으로 묘사됩니다. 해 아래의 허무를 본 전도자가, 하늘의 방향으로 시선을 돌립니다.",
 apply:"생명이 유한하다는 사실을 두려움이 아니라 '지금 사랑할 이유'로 받아들여 보세요.",
 prayer:"하나님, 제 영이 주께로 돌아갈 날을 두려워하지 않게 하소서. 오늘 주신 시간을 사랑과 감사로 채우게 하소서. 아멘.",
 hymn:{t:"천국에서 만나보자"}, ccm:{t:"본향을 향하여"}},
{ref:"12:9-11", ch:[12], title:"지혜자의 말은 찌르는 채찍과 박힌 못 같다",
 summary:"전도자는 지혜로운 사람으로서 백성을 가르치고 많은 잠언을 살피고 정리했습니다. 지혜자의 말씀은 찌르는 막대기 같고 잘 박힌 못 같으며, 한 목자께서 주신 것이라고 말합니다.",
 interp:"진리의 말씀은 때로 우리를 찌르지만 길을 이끄는 방향으로 작용하고, 삶의 중심을 붙잡아 주는 못과 같습니다. 모든 지혜의 근원은 '한 목자', 곧 하나님이십니다.",
 apply:"이번 주 들은 말씀 중 마음을 찌른 한 문장을 골라 책상이나 휴대폰 배경에 붙여 보세요.",
 prayer:"선한 목자 되신 주님, 때로 아프게 찌르는 말씀도 저를 바른길로 이끄는 사랑임을 믿습니다. 말씀에 머물게 하소서. 아멘.",
 hymn:{t:"선한 목자 되신 우리 주"}, ccm:{t:"여호와는 나의 목자"}},
{ref:"12:12-14", ch:[12], title:"결론: 하나님을 경외하고 그 명령을 지키라",
 summary:"책을 많이 짓는 일은 끝이 없고 공부를 많이 하면 몸이 피곤합니다. 전도자는 결론으로, 하나님을 경외하고 그분의 계명을 지키는 것이 사람의 본분이며, 하나님이 모든 행위를 심판하실 것이라고 말합니다.",
 interp:"지금까지의 탐색 끝에 얻은 핵심은 '하나님 경외'입니다. 모든 것을 이해하지 못해도, 하나님 앞에서 사는 삶이 가장 확실한 길이라는 요약입니다.",
 apply:"31일을 돌아보며 가장 마음에 남은 한 문장을 적고, 앞으로 한 달간 지킬 작은 결단 하나를 정해 보세요.",
 prayer:"주님, 31일 동안 전도서의 말씀으로 저를 이끌어 주셔서 감사합니다. 해 아래에서 헛된 것을 붙잡지 않고, 주를 경외하며 주의 뜻을 따라 살게 하소서. 아멘.",
 hymn:{t:"주 예수 이름 높이어"}, ccm:{t:"주님을 경외합니다"}}
];
</script>
<script>
window.VERSES={"1:1-11": [[1, "다윗의 아들 예루살렘 왕 전도자의 말씀이라"], [2, "전도자가 가로되 헛되고 헛되며 헛되고 헛되니 모든 것이 헛되도다"], [3, "사람이 해 아래서 수고하는 모든 수고가 자기에게 무엇이 유익한고"], [4, "한 세대는 가고 한 세대는 오되 땅은 영원히 있도다"], [5, "해는 떴다가 지며 그 떴던 곳으로 빨리 돌아가고"], [6, "바람은 남으로 불다가 북으로 돌이키며 이리 돌며 저리 돌아 불던 곳으로 돌아가고"], [7, "모든 강물은 다 바다로 흐르되 바다를 채우지 못하며 어느 곳으로 흐르든지 그리로 연하여 흐르느니라"], [8, "만물의 피곤함을 사람이 말로 다 할 수 없나니 눈은 보아도 족함이 없고 귀는 들어도 차지 아니하는도다"], [9, "이미 있던 것이 후에 다시 있겠고 이미 한 일을 후에 다시 할지라 해 아래는 새 것이 없나니"], [10, "무엇을 가리켜 이르기를 보라 이것이 새 것이라 할 것이 있으랴 오래 전 세대에도 이미 있었느니라"], [11, "이전 세대를 기억함이 없으니 장래 세대도 그 후 세대가 기억함이 없으리라"]], "1:12-18": [[12, "나 전도자는 예루살렘에서 이스라엘 왕이 되어"], [13, "마음을 다하며 지혜를 써서 하늘 아래서 행하는 모든 일을 궁구하며 살핀즉 이는 괴로운 것이니 하나님이 인생들에게 주사 수고하게 하신 것이라"], [14, "내가 해 아래서 행하는 모든 일을 본즉 다 헛되어 바람을 잡으려는 것이로다"], [15, "구부러진 것을 곧게 할 수 없고 이지러진 것을 셀 수 없도다"], [16, "내가 마음 가운데 말하여 이르기를 내가 큰 지혜를 많이 얻었으므로 나보다 먼저 예루살렘에 있던 자보다 낫다 하였나니 곧 내 마음이 지혜와 지식을 많이 만나 보았음이로다"], [17, "내가 다시 지혜를 알고자 하며 미친 것과 미련한 것을 알고자 하여 마음을 썼으나 이것도 바람을 잡으려는 것인 줄을 깨달았도다"], [18, "지혜가 많으면 번뇌도 많으니 지식을 더하는 자는 근심을 더하느니라"]], "2:1-11": [[1, "나는 내 마음에 이르기를 자, 내가 시험적으로 너를 즐겁게 하리니 너는 낙을 누리라 하였으나 본즉 이것도 헛되도다"], [2, "내가 웃음을 논하여 이르기를 미친 것이라 하였고 희락을 논하여 이르기를 저가 무엇을 하는가 하였노라"], [3, "내 마음이 궁구하기를 내가 어떻게 하여야 내 마음에 지혜로 다스림을 받으면서 술로 내 육신을 즐겁게 할까 또 어떻게 하여야 어리석음을 취하여서 천하 인생의 종신토록 생활함에 어떤 것이 쾌락인지 알까 하여"], [4, "나의 사업을 크게 하였노라 내가 나를 위하여 집들을 지으며 포도원을 심으며"], [5, "여러 동산과 과원을 만들고 그 가운데 각종 과목을 심었으며"], [6, "수목을 기르는 삼림에 물주기 위하여 못을 팠으며"], [7, "노비는 사기도 하였고 집에서 나게도 하였으며 나보다 먼저 예루살렘에 있던 모든 자보다도 소와 양떼의 소유를 많게 하였으며"], [8, "은금과 왕들의 보배와 여러 도의 보배를 쌓고 또 노래하는 남녀와 인생들의 기뻐하는 처와 첩들을 많이 두었노라"], [9, "내가 이같이 창성하여 나보다 먼저 예루살렘에 있던 모든 자보다 지나고 내 지혜도 내게 여전하여"], [10, "무엇이든지 내 마음이 즐거워하는 것을 내가 막지 아니하였으니 이는 나의 모든 수고를 내 마음이 기뻐하였음이라 이것이 나의 모든 수고로 말미암아 얻은 분복이로다"], [11, "그 후에 본즉 내 손으로 한 모든 일과 수고한 모든 수고가 다 헛되어 바람을 잡으려는 것이며 해 아래서 무익한 것이로다"]], "2:12-17": [[12, "내가 돌이켜 지혜와 망령됨과 어리석음을 보았나니 왕의 뒤에 오는 자는 무슨 일을 행할꼬 행한지 오랜 일일 뿐이리라"], [13, "내가 보건대 지혜가 우매보다 뛰어남이 빛이 어두움보다 뛰어남 같도다"], [14, "지혜자는 눈이 밝고 우매자는 어두움에 다니거니와 이들의 당하는 일이 일반인 줄을 내가 깨닫고"], [15, "심중에 이르기를 우매자의 당한 것을 나도 당하리니 내가 심중에 이르기를 이것도 헛되도다"], [16, "지혜자나 우매자나 영원토록 기억함을 얻지 못하나니 후일에는 다 잊어버린지 오랠 것임이라 오호라, 지혜자의 죽음이 우매자의 죽음과 일반이로다"], [17, "이러므로 내가 사는 것을 한하였노니 이는 해 아래서 하는 일이 내게 괴로움이요 다 헛되어 바람을 잡으려는 것임이로다"]], "2:18-26": [[18, "내가 해 아래서 나의 수고한 모든 수고를 한하였노니 이는 내 뒤를 이을 자에게 끼치게 됨이라"], [19, "그 사람이 지혜자일지,우매자일지야 누가 알랴마는 내가 해 아래서 내 지혜를 나타내어 수고한 모든 결과를 저가 다 관리하리니 이것도 헛되도다"], [20, "이러므로 내가 해 아래서 수고한 모든 수고에 대하여 도리어 마음으로 실망케 하였도다"], [21, "어떤 사람은 그 지혜와 지식과 재주를 써서 수고하였어도 그 얻은 것을 수고하지 아니한 자에게 업으로 끼치리니 이것도 헛된 것이라 큰 해로다"], [22, "사람이 해 아래서 수고하는 모든 수고와 마음에 애쓰는 것으로 소득이 무엇이랴"], [23, "일평생에 근심하며 수고하는 것이 슬픔뿐이라 그 마음이 밤에도 쉬지 못하나니 이것도 헛되도다"], [24, "사람이 먹고 마시며 수고하는 가운데서 심령으로 낙을 누리게 하는 것보다 나은 것이 없나니 내가 이것도 본즉 하나님의 손에서 나는 것이로다"], [25, "먹고 즐거워하는 일에 누가 나보다 승하랴"], [26, "하나님이 그 기뻐하시는 자에게는 지혜와 지식과 희락을 주시나 죄인에게는 노고를 주시고 저로 모아 쌓게 하사 하나님을 기뻐하는 자에게 주게 하시나니 이것도 헛되어 바람을 잡으려는 것이로다"]], "3:1-8": [[1, "천하에 범사가 기한이 있고 모든 목적이 이룰 때가 있나니"], [2, "날 때가 있고, 죽을 때가 있으며, 심을 때가 있고, 심은 것을 뽑을 때가 있으며,"], [3, "죽일 때가 있고, 치료시킬 때가 있으며, 헐 때가 있고, 세울 때가 있으며,"], [4, "울 때가 있고, 웃을 때가 있으며, 슬퍼할 때가 있고, 춤출 때가 있으며,"], [5, "돌을 던져 버릴 때가 있고, 돌을 거둘 때가 있으며, 안을 때가 있고, 안는 일을 멀리 할 때가 있으며,"], [6, "찾을 때가 있고, 잃을 때가 있으며, 지킬 때가 있고, 버릴 때가 있으며,"], [7, "찢을 때가 있고, 꿰멜 때가 있으며, 잠잠할 때가 있고, 말할 때가 있으며,"], [8, "사랑할 때가 있고, 미워할 때가 있으며, 전쟁할 때가 있고, 평화할때가 있느니라"]], "3:9-15": [[9, "일하는 자가 그 수고로 말미암아 무슨 이익이 있으랴"], [10, "하나님이 인생들에게 노고를 주사 애쓰게 하신 것을 내가 보았노라"], [11, "하나님이 모든 것을 지으시되 때를 따라 아름답게 하셨고 또 사람에게 영원을 사모하는 마음을 주셨느니라 그러나 하나님의 하시는 일의 시종을 사람으로 측량할 수 없게 하셨도다"], [12, "사람이 사는 동안에 기뻐하며 선을 행하는 것보다 나은 것이 없는 줄을 내가 알았고"], [13, "사람마다 먹고 마시는 것과 수고함으로 낙을 누리는 것이 하나님의 선물인 줄을 또한 알았도다"], [14, "무릇 하나님의 행하시는 것은 영원히 있을 것이라 더 할 수도 없고 덜 할 수도 없나니 하나님이 이같이 행하심은 사람으로 그 앞에서 경외하게 하려 하심인 줄을 내가 알았도다"], [15, "이제 있는 것이 옛적에 있었고 장래에 있을 것도 옛적에 있었나니 하나님은 이미 지난 것을 다시 찾으시느니라"]], "3:16-22": [[16, "내가 해 아래서 또 보건대 재판하는 곳에 악이 있고 공의를 행하는 곳에도 악이 있도다"], [17, "내가 심중에 이르기를 의인과 악인을 하나님이 심판하시리니 이는 모든 목적과 모든 일이 이룰 때가 있음이라 하였으며"], [18, "내가 심중에 이르기를 인생의 일에 대하여 하나님이 저희를 시험하시리니 저희로 자기가 짐승보다 다름이 없는 줄을 깨닫게 하려하심이라 하였노라"], [19, "인생에게 임하는 일이 일반이라 다 동일한 호흡이 있어서 이의 죽음같이 저도 죽으니 사람이 짐승보다 뛰어남이 없음은 모든 것이 헛됨이로다"], [20, "다 흙으로 말미암았으므로 다 흙으로 돌아가나니 다 한 곳으로 가거니와"], [21, "인생의 혼은 위로 올라가고 짐승의 혼은 아래 곧 땅으로 내려가는 줄을 누가 알랴"], [22, "그러므로 내 소견에는 사람이 자기 일에 즐거워하는 것보다 나은것이 없나니 이는 그의 분복이라 그 신후사를 보게 하려고 저를 도로 데리고 올 자가 누구이랴"]], "4:1-8": [[1, "내가 돌이켜 해 아래서 행하는 모든 학대를 보았도다 오호라 학대받는 자가 눈물을 흘리되 저희에게 위로자가 없도다 저희를 학대하는 자의 손에는 권세가 있으나 저희에게는 위로자가 없도다"], [2, "그러므로 나는 살아 있는 산 자보다 죽은 지 오랜 죽은 자를 복되다 하였으며"], [3, "이 둘보다도 출생하지 아니하여 해 아래서 행하는 악을 보지 못한 자가 더욱 낫다 하였노라"], [4, "내가 또 본즉 사람이 모든 수고와 여러 가지 교묘한 일로 인하여 이웃에게 시기를 받으니 이것도 헛되어 바람을 잡으려는 것이로다"], [5, "우매자는 손을 거두고 자기 살을 먹느니라"], [6, "한 손에만 가득하고 평온함이 두 손에 가득하고 수고하며 바람을 잡으려는 것보다 나으니라"], [7, "내가 또 돌이켜 해 아래서 헛된 것을 보았도다"], [8, "어떤 사람은 아들도 없고 형제도 없으니 아무도 없이 홀로 있으나 수고하기를 마지 아니하며 부를 눈에 족하게 여기지 아니하면서도 이르기를 내가 누구를 위하여 수고하고 내 심령으로 낙을 누리지 못하게 하는고 하나니 이것도 헛되어 무익한 노고로다"]], "4:9-16": [[9, "두 사람이 한 사람보다 나음은 저희가 수고함으로 좋은 상을 얻을 것임이라"], [10, "혹시 저희가 넘어지면 하나가 그 동무를 붙들어 일으키려니와 홀로 있어 넘어지고 붙들어 일으킬 자가 없는 자에게는 화가 있으리라"], [11, "두 사람이 함께 누우면 따뜻하거니와 한 사람이면 어찌 따뜻하랴"], [12, "한 사람이면 패하겠거니와 두 사람이면 능히 당하나니 삼겹 줄은 쉽게 끊어지지 아니하느니라"], [13, "가난하여도 지혜로운 소년은 늙고 둔하여 간함을 받을줄 모르는 왕보다 나으니"], [14, "저는 그 나라에서 나면서 가난한 자로서 옥에서 나와서 왕이 되었음이니라"], [15, "내가 본즉 해 아래서 다니는 인생들이 왕의 버금으로 대신하여 일어난 소년과 함께 있으매"], [16, "저희 치리를 받는 백성들이 무수하였을지라도 후에 오는 자들은 저를 기뻐하지 아니하리니 이것도 헛되어 바람을 잡으려는 것이로다"]], "5:1-7": [[1, "너는 하나님의 전에 들어갈 때에 네 발을 삼갈지어다 가까이 하여 말씀을 듣는 것이 우매자의 제사 드리는 것보다 나으니 저희는 악을 행하면서도 깨닫지 못함이니라"], [2, "너는 하나님 앞에서 함부로 입을 열지 말며 급한 마음으로 말을 내지 말라 하나님은 하늘에 계시고 너는 땅에 있음이니라 그런즉 마땅히 말을 적게 할 것이라"], [3, "일이 많으면 꿈이 생기고 말이 많으면 우매자의 소리가 나타나느니라"], [4, "네가 하나님께 서원하였거든 갚기를 더디게 말라 하나님은 우매자를 기뻐하지 아니하시나니 서원한 것을 갚으라"], [5, "서원하고 갚지 아니하는 것보다 서원하지 아니하는 것이 나으니"], [6, "네 입으로 네 육체를 범죄케 말라 사자 앞에서 내가 서원한 것이 실수라고 말하지 말라 어찌 하나님으로 네 말소리를 진노하사 네 손으로 한 것을 멸하시게 하랴"], [7, "꿈이 많으면 헛된 것이 많고 말이 많아도 그러하니 오직 너는 하나님을 경외할지니라"]], "5:8-19": [[8, "너는 어느 도에서든지 빈민을 학대하는 것과 공의를 박멸하는 것을 볼지라도 그것을 이상히 여기지 말라 높은 자보다 더 높은 자가 감찰하고 그들보다 더 높은 자들이 있음이니라"], [9, "땅의 이익은 뭇 사람을 위하여 있나니 왕도 밭의 소산을 받느니라"], [10, "은을 사랑하는 자는 은으로 만족함이 없고 풍부를 사랑하는 자는 소득으로 만족함이 없나니 이것도 헛되도다"], [11, "노동자는 먹는 것이 많든지 적든지 잠을 달게 자거니와 부자는 배부름으로 자지 못하느니라"], [12, "내가 해 아래서 큰 폐단되는 것을 보았나니 곧 소유주가 재물을 자기에게 해 되도록 지키는 것이라"], [13, "그 재물이 재난을 인하여 패하나니 비록 아들은 낳았으나 그 손에 아무 것도 없느니라"], [14, "저가 모태에서 벌거벗고 나왔은즉 그 나온 대로 돌아가고 수고하여 얻은 것을 아무 것도 손에 가지고 가지 못하리니"], [15, "이것도 폐단이라 어떻게 왔든지 그대로 가리니 바람을 잡으려는 수고가 저에게 무엇이 유익하랴"], [16, "일평생을 어두운 데서 먹으며 번뇌와 병과 분노가 저에게 있느니라"], [17, "사람이 하나님의 주신 바 그 일평생에 먹고 마시며 해 아래서 수고하는 모든 수고 중에서 낙을 누리는 것이 선하고 아름다움을 내가 보았나니 이것이 그의 분복이로다"], [18, "어떤 사람에게든지 하나님이 재물과 부요를 주사 능히 누리게 하시며 분복을 받아 수고함으로 즐거워하게 하신 것은 하나님의 선물이라"], [19, "저는 그 생명의 날을 깊이 관념치 아니하리니 이는 하나님이 저의 마음의 기뻐하는 것으로 응하심이라"]], "6:1-12": [[1, "내가 해 아래서 한가지 폐단 있는 것을 보았나니 이는 사람에게 중한 것이라"], [2, "어떤 사람은 그 심령의 모든 소원에 부족함이 없어 재물과 부요와 존귀를 하나님께 받았으나 능히 누리게 하심을 얻지 못하였으므로 다른 사람이 누리나니 이것도 헛되어 악한 병이로다"], [3, "사람이 비록 일백 자녀를 낳고 또 장수하여 사는 날이 많을지라도 그 심령에 낙이 족하지 못하고 또 그 몸이 매장되지 못하면 나는 이르기를 낙태된 자가 저보다 낫다 하노니"], [4, "낙태된 자는 헛되이 왔다가 어두운 중에 가매 그 이름이 어두움에 덮이니"], [5, "햇빛을 보지 못하고 알지 못하나 이가 저보다 평안함이라"], [6, "저가 비록 천 년의 갑절을 산다 할지라도 낙을 누리지 못하면 마침내 다 한 곳으로 돌아가는 것뿐이 아니냐"], [7, "사람의 수고는 다 그 입을 위함이나 그 식욕은 차지 아니하느니라"], [8, "지혜자가 우매자보다 나은 것이 무엇이뇨 인생 앞에서 행할 줄 아는 가난한 자는 무엇이 유익한고"], [9, "눈으로 보는 것이 심령의 공상보다 나으나 이것도 헛되어 바람을 잡으려는 것이로다"], [10, "이미 있는 무엇이든지 오래 전부터 그 이름이 칭한 바 되었으며 사람이 무엇인지도 이미 안 바 되었나니 자기보다 강한 자와 능히 다툴 수 없느니라"], [11, "헛된 것을 더하게 하는 많은 일이 있나니 사람에게 무엇이 유익하랴"], [12, "헛된 생명의 모든 날을 그림자같이 보내는 일평생에 사람에게 무엇이 낙인지 누가 알며 그 신후에 해 아래서 무슨 일이 있을 것을 누가 능히 그에게 고하리요"]], "7:1-6": [[1, "아름다운 이름이 보배로운 기름보다 낫고 죽는 날이 출생하는 날보다 나으며"], [2, "초상집에 가는 것이 잔치집에 가는 것보다 나으니 모든 사람의 결국이 이와 같이 됨이라 산 자가 이것에 유심하리로다"], [3, "슬픔이 웃음보다 나음은 얼굴에 근심함으로 마음이 좋게 됨이니라"], [4, "지혜자의 마음은 초상집에 있으되 우매자의 마음은 연락하는 집에 있느니라"], [5, "사람이 지혜자의 책망을 듣는 것이 우매자의 노래를 듣는 것보다 나으니라"], [6, "우매자의 웃음 소리는 솥 밑에서 가시나무의 타는 소리 같으니 이것도 헛되니라"]], "7:7-14": [[7, "탐학이 지혜자를 우매하게 하고 뇌물이 사람의 명철을 망케 하느니라"], [8, "일의 끝이 시작보다 낫고 참는 마음이 교만한 마음보다 나으니"], [9, "급한 마음으로 노를 발하지 말라 노는 우매자의 품에 머무름이니라"], [10, "옛날이 오늘보다 나은 것이 어찜이냐 하지 말라 이렇게 묻는 것이 지혜가 아니니라"], [11, "지혜는 유업같이 아름답고 햇빛을 보는 자에게 유익하도다"], [12, "지혜도 보호하는 것이 되고 돈도 보호하는 것이 되나 지식이 더욱 아름다움은 지혜는 지혜 얻은 자의 생명을 보존함이니라"], [13, "하나님의 행하시는 일을 보라 하나님이 굽게 하신 것을 누가 능히 곧게 하겠느냐"], [14, "형통한 날에는 기뻐하고 곤고한 날에는 생각하라 하나님이 이 두가지를 병행하게 하사 사람으로 그 장래 일을 능히 헤아려 알지 못하게 하셨느니라"]], "7:15-22": [[15, "내가 내 헛된 날에 이 모든 일을 본즉 자기의 의로운 중에서 멸망하는 의인이 있고 자기의 악행 중에서 장수하는 악인이 있으니"], [16, "지나치게 의인이 되지 말며 지나치게 지혜자도 되지 말라 어찌하여 스스로 패망케 하겠느냐"], [17, "지나치게 악인이 되지 말며 우매자도 되지 말라 어찌하여 기한 전에 죽으려느냐"], [18, "너는 이것을 잡으며 저것을 놓지 마는 것이 좋으니 하나님을 경외하는 자는 이 모든 일에서 벗어날 것임이니라"], [19, "지혜가 지혜자로 성읍 가운데 열 유사보다 능력이 있게 하느니라"], [20, "선을 행하고 죄를 범치 아니하는 의인은 세상에 아주 없느니라"], [21, "무릇 사람의 말을 들으려고 마음을 두지 말라 염려컨대 네 종이 너를 저주하는 것을 들으리라"], [22, "너도 가끔 사람을 저주한 것을 네 마음이 아느니라"]], "7:23-29": [[23, "내가 이 모든 것을 지혜로 시험하며 스스로 이르기를 내가 지혜자가 되리라 하였으나 지혜가 나를 멀리하였도다"], [24, "무릇 된 것이 멀고 깊고 깊도다 누가 능히 통달하랴"], [25, "내가 돌이켜 전심으로 지혜와 명철을 살피고 궁구하여 악한 것이 어리석은 것이요 어리석은 것이 미친 것인 줄을 알고자 하였더니"], [26, "내가 깨달은즉 마음이 올무와 그물같고 손이 포승같은 여인은 사망보다 독한 자라 하나님을 기뻐하는 자는 저를 피하려니와 죄인은 저에게 잡히리로다"], [27, "전도자가 가로되 내가 낱낱이 살펴 그 이치를 궁구하여 이것을 깨달았노라"], [28, "내 마음에 찾아도 아직 얻지 못한 것이 이것이라 일천 남자 중에서 하나를 얻었거니와 일천 여인 중에서는 하나도 얻지 못하였느니라"], [29, "나의 깨달은 것이 이것이라 곧 하나님이 사람을 정직하게 지으셨으나 사람은 많은 꾀를 낸 것이니라"]], "8:1-9": [[1, "지혜자와 같은 자 누구며 사리의 해석을 아는 자 누구냐 사람의 지혜는 그 사람의 얼굴에 광채가 나게 하나니 그 얼굴의 사나운 것이 변하느니라"], [2, "내가 권하노니 왕의 명령을 지키라 이미 하나님을 가리켜 맹세하였음이니라"], [3, "왕 앞에서 물러가기를 급거히 말며 악한 것을 일삼지 말라 왕은 그 하고자 하는 것을 다 행함이니라"], [4, "왕의 말은 권능이 있나니 누가 이르기를 왕께서 무엇을 하시나이까 할 수 있으랴"], [5, "무릇 명령을 지키는 자는 화를 모르리라 지혜자의 마음은 시기와 판단을 분변하나니"], [6, "무론 무슨 일에든지 시기와 판단이 있으므로 사람에게 임하는 화가 심함이니라"], [7, "사람이 장래 일을 알지 못하나니 장래 일을 가르칠 자가 누구이랴"], [8, "생기를 주장하여 생기로 머무르게할 사람도 없고 죽는 날을 주장할 자도 없고 전쟁할 때에 모면할 자도 없으며 악이 행악자를 건져낼 수도 없느니라"], [9, "내가 이런 것들을 다 보고 마음을 다하여 해 아래서 행하는 모든 일을 살핀즉 사람이 사람을 주장하여 해롭게 하는 때가 있으며"]], "8:10-17": [[10, "내가 본즉 악인은 장사 지낸 바 되어 무덤에 들어 갔고 선을 행한 자는 거룩한 곳에서 떠나 성읍 사람의 잊어버린 바 되었으니 이것도 헛되도다"], [11, "악한 일에 징벌이 속히 실행되지 않으므로 인생들이 악을 행하기에 마음이 담대하도다"], [12, "죄인이 백번 악을 행하고도 장수하거니와 내가 정녕히 아노니 하나님을 경외하여 그 앞에서 경외하는 자가 잘 될 것이요"], [13, "악인은 잘 되지 못하며 장수하지 못하고 그 날이 그림자와 같으리니 이는 하나님 앞에 경외하지 아니함이니라"], [14, "세상에 행하는 헛된 일이 있나니 곧 악인의 행위대로 받는 의인도 있고 의인의 행위대로 받는 악인도 있는 것이라 내가 이르노 니 이것도 헛되도다"], [15, "이에 내가 희락을 칭찬하노니 이는 사람이 먹고 마시고 즐거워하는 것보다 해 아래서 나은 것이 없음이라 하나님이 사람으로 해 아래서 살게 하신 날 동안 수고하는 중에 이것이 항상 함께 있을것이니라"], [16, "내가 마음을 다하여 지혜를 알고자 하며 세상에서 하는 노고를 보고자 하는 동시에 (밤낮으로 자지 못하는 자도 있도다)"], [17, "하나님의 모든 행사를 살펴보니 해 아래서 하시는 일을 사람이 능히 깨달을 수 없도다 사람이 아무리 애써 궁구할지라도 능히 깨닫지 못하나니 비록 지혜자가 아노라 할지라도 능히 깨닫지 못하리로다"]], "9:1-6": [[1, "내가 마음을 다하여 이 모든 일을 궁구하며 살펴본즉 의인과 지혜자나 그들의 행하는 일이나 다 하나님의 손에 있으니 사랑을 받을는지 미움을 받을는지 사람이 알지 못하는 것은 모두 그 미래임이니라"], [2, "모든 사람에게 임하는 모든 것이 일반이라 의인과 악인이며 선하고 깨끗한 자와 깨끗지 않은 자며 제사를 드리는 자와 제사를 드리지 아니하는 자의 결국이 일반이니 선인과 죄인이며 맹세하는 자와 맹세하기를 무서워하는 자가 일반이로다"], [3, "모든 사람의 결국이 일반인 그것은 해 아래서 모든 일 중에 악한 것이니 곧 인생의 마음에 악이 가득하여 평생에 미친 마음을 품 다가 후에는 죽은 자에게로 돌아가는 것이라"], [4, "모든 산 자 중에 참예한 자가 소망이 있음은 산 개가 죽은 사자보다 나음이니라"], [5, "무릇 산 자는 죽을 줄을 알되 죽은 자는 아무 것도 모르며 다시는 상도 받지 못하는 것은 그 이름이 잊어버린 바 됨이라"], [6, "그 사랑함과 미워함과 시기함이 없어진 지 오래니 해 아래서 행하는 모든 일에 저희가 다시는 영영히 분복이 없느니라"]], "9:7-12": [[7, "너는 가서 기쁨으로 네 식물을 먹고 즐거운 마음으로 네 포도주를 마실지어다 이는 하나님이 너의 하는 일을 벌써 기쁘게 받으셨음이니라"], [8, "네 의복을 항상 희게하며 네 머리에 향 기름을 그치지 않게 할지니라"], [9, "네 헛된 평생의 모든 날 곧 하나님이 해 아래서 네게 주신 모든 헛된 날에 사랑하는 아내와 함께 즐겁게 살지어다 이는 네가 일평생에 해 아래서 수고하고 얻은 분복이니라"], [10, "무릇 네 손이 일을 당하는대로 힘을 다하여 할찌어다 네가 장차 들어갈 음부에는 일도 없고 계획도 없고 지식도 없고 지혜도 없음이니라"], [11, "내가 돌이켜 해 아래서 보니 빠른 경주자라고 선착하는 것이 아니며 유력자라고 전쟁에 승리하는 것이 아니며 지혜자라고 식물을 얻는 것이 아니며 명철자라고 재물을 얻는 것이 아니며 기능자라고 은총을 입는 것이 아니니 이는 시기와 우연이 이 모든 자에게 임함이라"], [12, "대저 사람은 자기의 시기를 알지 못하나니 물고기가 재앙의 그물에 걸리고 새가 올무에 걸림같이 인생도 재앙의 날이 홀연히 임하면 거기 걸리느니라"]], "9:13-18": [[13, "내가 또 해 아래서 지혜를 보고 크게 여긴 것이 이러하니"], [14, "곧 어떤 작고 인구가 많지 않은 성읍에 큰 임금이 와서 에워싸고 큰 흉벽을 쌓고 치고자 할 때에"], [15, "그 성읍 가운데 가난한 지혜자가 있어서 그 지혜로 그 성읍을 건진 것이라 그러나 이 가난한 자를 기억하는 사람이 없었도다"], [16, "그러므로 내가 이르기를 지혜가 힘보다 낫다마는 가난한 자의 지혜가 멸시를 받고 그 말이 신청되지 아니한다 하였노라"], [17, "종용히 들리는 지혜자의 말이 우매자의 어른의 호령보다 나으니라"], [18, "지혜가 병기보다 나으니라 그러나 한 죄인이 많은 선을 패궤케 하느니라"]], "10:1-7": [[1, "죽은 파리가 향기름으로 악취가 나게 하는 것 같이 적은 우매가 지혜와 존귀로 패하게 하느니라"], [2, "지혜자의 마음은 오른편에 있고 우매자의 마음은 왼편에 있느니라"], [3, "우매자는 길에 행할 때에도 지혜가 결핍하여 각 사람에게 자기의 우매한 것을 말하느니라"], [4, "주권자가 네게 분을 일으키거든 너는 네 자리를 떠나지 말라 공순이 큰 허물을 경하게 하느니라"], [5, "내가 해 아래서 한 가지 폐단 곧 주권자에게서 나는 허물인 듯한것을 보았노니"], [6, "우매자가 크게 높은 지위를 얻고 부자가 낮은 지위에 앉는도다"], [7, "또 보았노니 종들은 말을 타고 방백들은 종처럼 땅에 걸어 다니는도다"]], "10:8-15": [[8, "함정을 파는 자는 거기 빠질 것이요 담을 허는 자는 뱀에게 물리리라"], [9, "돌을 떠내는 자는 그로 인하여 상할 것이요 나무를 쪼개는 자는 그로 인하여 위험을 당하리라"], [10, "무딘 철 연장 날을 갈지 아니하면 힘이 더 드느니라 오직 지혜는 성공하기에 유익하니라"], [11, "방술을 베풀기 전에 뱀에게 물렸으면 술객은 무용하니라"], [12, "지혜자의 입의 말은 은혜로우나 우매자의 입술은 자기를 삼키나니"], [13, "그 입의 말의 시작은 우매요 끝은 광패니라"], [14, "우매자는 말을 많이 하거니와 사람이 장래 일을 알지 못하나니 신후사를 알게 할 자가 누구이냐"], [15, "우매자들의 수고는 제각기 곤하게 할 뿐이라 저희는 성읍에 들어갈 줄도 알지 못함이니라"]], "10:16-20": [[16, "왕은 어리고 대신들은 아침에 연락하는 이 나라여 화가 있도다"], [17, "왕은 귀족의 아들이요 대신들은 취하려 함이 아니라 기력을 보하려고 마땅한 때에 먹는 이 나라여 복이 있도다"], [18, "게으른즉 석가래가 퇴락하고 손이 풀어진즉 집이 새느니라"], [19, "잔치는 희락을 위하여 베푸는 것이요 포도주는 생명을 기쁘게 하는 것이나 돈은 범사에 응용되느니라"], [20, "심중에라도 왕을 저주하지 말며 침방에서라도 부자를 저주하지 말라 공중의 새가 그 소리를 전하고 날짐승이 그 일을 전파할 것임이니라"]], "11:1-6": [[1, "너는 네 식물을 물 위에 던지라 여러날 후에 도로 찾으리라"], [2, "일곱에게나 여덟에게 나눠줄지어다 무슨 재앙이 땅에 임할는지 네가 알지 못함이니라"], [3, "구름에 비가 가득하면 땅에 쏟아지며 나무가 남으로나 북으로나 쓰러지면 그 쓰러진 곳에 그냥 있으리라"], [4, "풍세를 살펴보는 자는 파종하지 아니할 것이요 구름을 바라보는 자는 거두지 아니하리라"], [5, "바람의 길이 어떠함과 아이 밴 자의 태에서 뼈가 어떻게 자라는 것을 네가 알지 못함같이 만사를 성취하시는 하나님의 일을 네가 알지 못하느니라"], [6, "너는 아침에 씨를 뿌리고 저녁에도 손을 거두지 말라 이것이 잘 될는지,저것이 잘 될는지, 혹 둘이 다 잘 될는지 알지 못함이니라"]], "11:7-10": [[7, "빛은 실로 아름다운 것이라 눈으로 해를 보는 것이 즐거운 일이로다"], [8, "사람이 여러 해를 살면 항상 즐거워할지로다 그러나 캄캄한 날이 많으리니 그 날을 생각할지로다 장래 일은 다 헛되도다"], [9, "청년이여 네 어린 때를 즐거워 하며 네 청년의 날을 마음에 기뻐하여 마음에 원하는 길과 네 눈이 보는대로 좇아 행하라 그러나 하나님이 이 모든 일로 인하여 너를 심판하실 줄 알라"], [10, "그런즉 근심으로 네 마음에서 떠나게 하며 악으로 네 몸에서 물러가게 하라 어릴 때와 청년의 때가 다 헛되니라"]], "12:1-5": [[1, "너는 청년의 때 곧 곤고한 날이 이르기 전,나는 아무 낙이 없다고 할 해가 가깝기 전에 너의 창조자를 기억하라"], [2, "해와 빛과 달과 별들이 어둡기 전에 비 뒤에 구름이 다시 일어나기 전에 그리하라"], [3, "그런 날에는 집을지키는 자들이 떨 것이며 힘있는 자들이 구부러질 것이며 맷돌질 하는 자들이 적으므로 그칠 것이며 창들로 내어다 보는 자가 어두워질 것이며"], [4, "길거리 문들이 닫혀질 것이며 맷돌 소리가 적어질 것이며 새의 소리를 인하여 일어날 것이며 음악하는 여자들은 다 쇠하여질 것이며"], [5, "그런 자들은 높은 곳을 두려워할 것이며 길에서는 놀랄 것이며 살구나무가 꽃이 필 것이며 메뚜기도 짐이 될 것이며 원욕이 그치리니 이는 사람이 자기 영원한 집으로 돌아가고 조문자들이 거리로 왕래하게 됨이라"]], "12:6-8": [[6, "은줄이 풀리고 금 그릇이 깨어지고 항아리가 샘 곁에서 깨어지고 바퀴가 우물 위에서 깨어지고"], [7, "흙은 여전히 땅으로 돌아가고 신은 그 주신 하나님께로 돌아가기 전에 기억하라"], [8, "전도자가 가로되 헛되고 헛되도다 모든 것이 헛되도다"]], "12:9-11": [[9, "전도자가 지혜로움으로 여전히 백성에게 지식을 가르쳤고 또 묵상하고 궁구하여 잠언을 많이 지었으며"], [10, "전도자가 힘써 아름다운 말을 구하였나니 기록한 것은 정직하여 진리의 말씀이니라"], [11, "지혜자의 말씀은 찌르는 채찍같고 회중의 스승의 말씀은 잘 박힌못 같으니 다 한 목자의 주신 바니라"]], "12:12-14": [[12, "내 아들아 또 경계를 받으라 여러 책을 짓는 것은 끝이 없고 많이 공부하는 것은 몸을 피곤케 하느니라"], [13, "일의 결국을 다 들었으니 하나님을 경외하고 그 명령을 지킬지어다 이것이 사람의 본분이니라"], [14, "하나님은 모든 행위와 모든 은밀한 일을 선악간에 심판하시리라"]]};
</script>
<script>
const KEY='qoheleth31';
const TABS=[['today','오늘'],['week','주간'],['month','월간'],['all','진행']];
const DAY=86400000;
let st={start:null,done:{},sel:null,tab:'today',weekIdx:null};
try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({start:st.start,done:st.done}))}catch(e){}};
const ymd=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
st.start='2026-10-01';
const dayDate=n=>new Date(parse(st.start).getTime()+(n-1)*DAY+ (0));
const todayIdx=()=>{const t=parse(ymd(new Date())),s=parse(st.start);return Math.round((t-s)/DAY)+1};
const curDay=()=>Math.min(31,Math.max(1,todayIdx()));
const doneCount=()=>Object.keys(st.done).filter(k=>st.done[k]).length;
const D=n=>window.DAYS[n-1];
const yt=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q)+'&sp=CAM%253D';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=d=>{const x=d;return (x.getMonth()+1)+'/'+x.getDate()};
const dw='일월화수목금토';

function streak(){let s=0;for(let n=Math.min(31,Math.max(todayIdx(),1));n>=1;n--){if(st.done[n])s++;else if(n===todayIdx())continue;else break}return s}

function go(tab,sel){st.tab=tab;if(sel)st.sel=sel;render();scrollTo(0,0)}
function toggle(n){st.done[n]=!st.done[n];if(!st.done[n])delete st.done[n];save();render()}

function viewToday(){
  const n=st.sel||curDay(),d=D(n),dt=dayDate(n);
  const late=todayIdx()<1?'10월 1일부터 시작합니다. 미리 둘러볼 수 있어요.':'';
  return `
  <div class="daynav"><button onclick="st.sel=${Math.max(1,n-1)};render()" ${n<=1?'disabled':''}>◀</button>
  <span>${n}일차 · ${md(dt)} (${dw[dt.getDay()]})${n===todayIdx()?' · 오늘':''}</span>
  <button onclick="st.sel=${Math.min(31,n+1)};render()" ${n>=31?'disabled':''}>▶</button></div>
  ${late?`<p class="note">${late}</p>`:''}
  <div class="card"><div class="ref">전도서 ${d.ref}</div><div class="title">${esc(d.title)}</div>
    <p class="summary">${esc(d.summary)}</p></div>
  <div class="card"><h2>📖 본문 (개역한글)</h2>${(window.VERSES[d.ref]||[]).map(([v,t])=>`<p class="v"><sup>${v}</sup>${esc(t)}</p>`).join('')}
    <p class="note">개역한글(1961)은 공개 도메인(저작권 만료) 번역입니다.</p></div>
  <div class="card"><h2>🎵 오늘의 찬양</h2>
    <div class="media"><div><small>찬송가</small><b>${esc(d.hymn.t)}</b></div><a class="btn" target="_blank" rel="noopener" href="${yt('찬송가 '+d.hymn.t)}">▶ 유튜브</a></div>
    <div class="media"><div><small>CCM</small><b>${esc(d.ccm.t)}</b></div><a class="btn" target="_blank" rel="noopener" href="${yt('CCM '+d.ccm.t)}">▶ 유튜브</a></div>
    <p class="note">유튜브 검색 결과를 조회수순으로 정렬해 열립니다. 맨 위 영상이 조회수가 가장 많은 영상입니다.</p></div>
  <div class="card"><h2>📜 본문 해석</h2><p>${esc(d.interp)}</p></div>
  <div class="card"><h2>🌱 오늘의 적용</h2><p>${esc(d.apply)}</p></div>
  <div class="card"><h2>🙏 오늘의 기도</h2><p class="prayer">${esc(d.prayer)}</p></div>
  <button class="done-btn ${st.done[n]?'on':''}" onclick="toggle(${n})">${st.done[n]?'✓ 묵상 완료 (취소하려면 누르세요)':'오늘 묵상 완료'}</button>`;
}

function cellHtml(n){
  const t=todayIdx(),dt=dayDate(n);
  const cls=['cell',st.done[n]?'done':'',n===t?'today':'',n>t?'future':''].join(' ');
  return `<button class="${cls}" onclick="go('today',${n})"><b>${n}</b><small>${md(dt)}</small></button>`;
}

function viewWeek(){
  const weeks=5,t=todayIdx();
  let w=st.weekIdx??Math.min(weeks,Math.max(1,Math.ceil(curDay()/7)));
  const a=(w-1)*7+1,b=Math.min(31,a+6);
  let rows='';
  for(let n=a;n<=b;n++){
    const d=D(n),dt=dayDate(n);
    rows+=`<button class="wk ${st.done[n]?'done':''} ${n===t?'today':''}" onclick="go('today',${n})"><span class="n">${st.done[n]?'✓':n}</span><span><b>${md(dt)} (${dw[dt.getDay()]}) · ${esc(d.title)}</b><small>전도서 ${d.ref}</small></span></button>`;
  }
  const c=[...Array(b-a+1)].filter((_,i)=>st.done[a+i]).length;
  return `<div class="daynav"><button onclick="st.weekIdx=${Math.max(1,w-1)};render()" ${w<=1?'disabled':''}>◀</button><span>${w}주차 (${a}~${b}일차)</span><button onclick="st.weekIdx=${Math.min(weeks,w+1)};render()" ${w>=weeks?'disabled':''}>▶</button></div>
  <div class="card"><h2>이번 주 진행 ${c}/${b-a+1}</h2><div class="bar"><i style="width:${c/(b-a+1)*100}%"></i></div></div>
  <div class="week">${rows}</div>`;
}

function viewMonth(){
  const s=parse(st.start),first=s.getDay();
  let cells='';for(let i=0;i<first;i++)cells+='<div class="cell empty"></div>';
  for(let n=1;n<=31;n++)cells+=cellHtml(n);
  return `<div class="card"><h2>2026년 10월 · 묵상 달력</h2>
  <div class="dow">${[...dw].map(x=>`<span>${x}</span>`).join('')}</div>
  <div class="grid">${cells}</div>
  <p class="note">날짜를 누르면 그날의 묵상으로 이동합니다. 금색 테두리가 오늘, 채워진 칸은 완료한 날입니다.</p></div>`;
}

function viewAll(){
  const c=doneCount(),pct=Math.round(c/31*100);
  const chs=[...Array(12)].map((_,i)=>{const ch=i+1,days=window.DAYS.map((d,j)=>d.ch.includes(ch)?j+1:0).filter(Boolean),dn=days.filter(n=>st.done[n]).length;return `<div class="ch"><span>${ch}장</span><div class="bar"><i style="width:${days.length?dn/days.length*100:0}%"></i></div><span>${dn}/${days.length}</span></div>`}).join('');
  return `<div class="card"><h2>전체 진행상황</h2><div class="title" style="margin:0 0 8px">${c} / 31일 · ${pct}%</div><div class="bar"><i style="width:${pct}%"></i></div>
  <div class="stats" style="margin-top:14px"><div><b>${c}</b><small>완료</small></div><div><b>${31-c}</b><small>남은 날</small></div><div><b>${streak()}</b><small>연속</small></div></div>
  ${c===31?'<p style="margin-top:12px;text-align:center">🎉 31일 묵상을 모두 마쳤습니다!</p>':''}</div>
  <div class="card"><h2>장별 진행</h2>${chs}<p class="note">한 날이 두 장에 걸치면 양쪽에 함께 집계됩니다.</p></div>
  <div class="card"><h2>기록</h2>  <div class="row"><button class="btn" onclick="if(confirm('모든 완료 기록을 지울까요?')){st.done={};save();render()}">기록 초기화</button></div></div>`;
}

function render(){
  const v={today:viewToday,week:viewWeek,month:viewMonth,all:viewAll}[st.tab]();
  document.getElementById('app').innerHTML=v;
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button class="${st.tab===k?'on':''}" onclick="st.tab='${k}';if('${k}'==='today')st.sel=null;if('${k}'==='week')st.weekIdx=null;render();scrollTo(0,0)">${l}</button>`).join('');
  document.getElementById('sub').textContent='개역한글 · 10/1~10/31 · '+doneCount()+'/31일 완료';
}
render();
</script>
</body>
</html>
