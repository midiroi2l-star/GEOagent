    <script>
      // 첫 화면 깜빡임 없이 다크 모드·글자 크기 적용
      try {
        var s = JSON.parse(localStorage.getItem('daily-devotional:v1') || '{}').settings || {}
        var dark = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        if (s.fontScale) document.documentElement.style.fontSize = s.fontScale * 100 + '%'
      } catch (e) {}
    </script>
